<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FinLearn: choose a new password</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fafafa;margin:0;padding:1.5rem;color:#1d1d1b}
.card{max-width:420px;margin:2rem auto;background:#fff;border:1px solid #e4e4e7;border-radius:24px;padding:1.75rem}
h1{font-size:1.5rem;margin:.2rem 0 .5rem} p{line-height:1.55;color:#52525b}
label{display:block;font-weight:700;font-size:.9rem;margin:1rem 0 .3rem}
input[type=password]{width:100%;box-sizing:border-box;padding:.8rem;border:1px solid #d4d4d8;border-radius:12px;font-size:1rem}
button{margin-top:1.25rem;width:100%;padding:.9rem;border:0;border-radius:14px;background:#FF6B35;color:#fff;font-weight:800;font-size:1.05rem}
.err{background:#fef2f2;color:#b91c1c;border-radius:12px;padding:.7rem .9rem;margin:.8rem 0}
.ok{background:#ecfdf5;color:#047857;border-radius:12px;padding:.9rem;margin:.8rem 0}
</style>
</head>
<body>
<div class="card">
<h1>{{TITLE}}</h1>
{{BODY}}
</div>
</body>
</html>
