<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Manrope:wght@600&display=swap">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:linear-gradient(135deg,#FF6B35,#FF8A4C 55%,#EC4899);display:flex;align-items:center;gap:30px;padding:0 70px;box-sizing:border-box;font-family:Manrope,sans-serif;color:#fff}
.t{font-family:Outfit,sans-serif;font-weight:900;font-size:68px;line-height:1.02;letter-spacing:-.02em;margin:0 0 18px}
.s{font-size:27px;font-weight:600;opacity:.95;max-width:560px;line-height:1.35;margin:0}
.chips{display:flex;gap:12px;margin-top:26px}
.chip{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.4);border-radius:99px;padding:8px 20px;font-family:Outfit,sans-serif;font-weight:700;font-size:22px}
img{width:340px;height:340px;flex:none;margin-left:auto}
</style></head><body>
<div><h1 class="t">Learn money<br>by making real choices</h1>
<p class="s">Budgeting, stocks, tax and crypto, taught through everyday situations and honest answers.</p>
<div class="chips"><span class="chip">Money basics</span><span class="chip">Stocks</span><span class="chip">Tax</span><span class="chip">Crypto</span></div></div>
<img src="../brand/out/logo-rounded.png">
</body></html>
